services:
  penna-sync:
    # 使用预构建镜像；想从源码构建时执行 docker compose up -d --build
    image: ghcr.io/penna-org/penna-sync:latest
    build: .
    container_name: penna-sync
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # 访问密钥：不填则首次启动自动生成（docker compose logs penna-sync 查看）
      # SYNC_SECRET: change-me-to-a-long-random-string
      # 扩展「账号」页显示的名字
      # SYNC_NAME: 我的同步服务器
      # 放在 Nginx / Caddy 之后时打开，限流才能拿到真实 IP
      # TRUST_PROXY: 'true'
      TZ: Asia/Shanghai
    volumes:
      # SQLite 数据库、APP_KEY 与访问密钥都在这里，备份这个卷即可
      - penna-sync-data:/data

volumes:
  penna-sync-data:
